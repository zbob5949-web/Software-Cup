<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>灵小游 3D</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101514;
      --panel: rgba(18, 25, 24, 0.88);
      --line: rgba(184, 207, 198, 0.22);
      --ink: #eef7f3;
      --muted: #9fb4ae;
      --accent: #64c3a5;
      --danger: #d87090;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 28% 18%, rgba(100, 195, 165, 0.16), transparent 34%),
        linear-gradient(135deg, #0c1110 0%, #17201e 54%, #111716 100%);
      overflow: hidden;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(420px, 1fr) minmax(380px, 520px);
    }

    .stage {
      position: relative;
      min-width: 0;
      overflow: hidden;
    }

    #avatarCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .topbar {
      position: absolute;
      left: 24px;
      top: 22px;
      right: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0;
    }

    .brand span,
    .status {
      color: var(--muted);
      font-size: 14px;
    }

    .status {
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(8, 12, 12, 0.42);
      backdrop-filter: blur(12px);
    }

    .map-link {
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(8, 12, 12, 0.42);
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      backdrop-filter: blur(12px);
      transition: border-color 0.2s;
    }
    .map-link:hover { border-color: var(--accent); }

    .chat {
      min-width: 0;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      border-left: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(16px);
    }

    .chat-head {
      padding: 20px 22px 14px;
      border-bottom: 1px solid var(--line);
    }

    .chat-head h2 {
      margin: 0 0 6px;
      font-size: 22px;
      letter-spacing: 0;
    }

    .chat-head p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .messages {
      min-height: 0;
      overflow: auto;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble {
      max-width: 88%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      line-height: 1.58;
      font-size: 15px;
      word-break: break-word;
      background: rgba(255, 255, 255, 0.06);
    }

    .bubble.user {
      align-self: flex-end;
      color: #06201a;
      border-color: transparent;
      background: var(--accent);
    }

    .bubble.assistant {
      align-self: flex-start;
    }

    .composer {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid var(--line);
      background: rgba(12, 17, 16, 0.68);
    }

    input {
      width: 100%;
      min-width: 0;
      height: 44px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.08);
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(100, 195, 165, 0.14);
    }

    button {
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 14px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.08);
      font-size: 15px;
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
      white-space: nowrap;
    }

    button:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
      transform: none;
    }

    .primary {
      color: #052019;
      border-color: var(--accent);
      background: var(--accent);
    }

    .recording {
      color: #fff;
      border-color: var(--danger);
      background: var(--danger);
    }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: 56vh auto;
      }
      .chat {
        height: 44vh;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
      .brand h1 { font-size: 23px; }
    }

    @media (max-width: 560px) {
      .composer {
        grid-template-columns: 1fr auto;
      }
      .composer input {
        grid-column: 1 / -1;
      }
      .topbar {
        left: 14px;
        right: 14px;
      }
    }
    /* ── 姿势调节器 ── */
    .pose-panel {
      position: absolute;
      left: 12px;
      bottom: 60px;
      z-index: 20;
      background: rgba(10, 16, 15, 0.92);
      border: 1px solid var(--line);
      border-radius: 10px;
      min-width: 220px;
      backdrop-filter: blur(10px);
      overflow: hidden;
    }
    .pose-toggle {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 13px;
      color: var(--accent);
      user-select: none;
    }
    .pose-body {
      padding: 8px 14px 14px;
    }
    .pose-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
    }
    .pose-row label {
      width: 52px;
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .pose-row input[type=range] {
      flex: 1;
      accent-color: var(--accent);
      height: 6px;
    }
    .pose-row span {
      width: 44px;
      text-align: right;
      font-size: 11px;
      color: var(--ink);
    }
    .pose-body button {
      width: 100%;
      margin-top: 4px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(100,195,165,0.12);
      color: var(--ink);
      cursor: pointer;
      font-size: 12px;
    }
    .pose-body hr {
      border: none;
      border-top: 1px solid var(--line);
      margin: 8px 0;
    }
    /* ── 口型测试面板 ── */
    .mouth-panel {
      position: absolute;
      right: 12px;
      bottom: 60px;
      z-index: 20;
      background: rgba(10, 16, 15, 0.92);
      border: 1px solid var(--line);
      border-radius: 10px;
      min-width: 240px;
      backdrop-filter: blur(10px);
      overflow: hidden;
    }
    .mouth-toggle {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 13px;
      color: var(--accent);
      user-select: none;
    }
    .mouth-body {
      padding: 8px 14px 14px;
      display: none;
    }
    .mouth-body .row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .mouth-body .row label {
      width: 32px;
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .mouth-body .row input[type=range] {
      flex: 1;
      accent-color: var(--accent);
      height: 6px;
    }
    .mouth-body .row span {
      width: 36px;
      text-align: right;
      font-size: 11px;
      color: var(--ink);
    }
    .mouth-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-top: 6px;
    }
    .mouth-grid button {
      height: 32px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: rgba(100,195,165,0.10);
      color: var(--ink);
      cursor: pointer;
      font-size: 13px;
    }
    .mouth-grid button:hover {
      border-color: var(--accent);
      background: rgba(100,195,165,0.22);
    }
    .mouth-grid button .py {
      display: block;
      font-size: 9px;
      color: var(--muted);
      margin-top: -2px;
    }
    .mouth-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .mouth-actions button {
      flex: 1;
      height: 28px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: rgba(255,255,255,0.06);
      color: var(--ink);
      cursor: pointer;
      font-size: 12px;
    }
    .mouth-mode-on {
      color: var(--accent) !important;
      border-color: var(--accent) !important;
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="stage" aria-label="灵小游 3D 数字人">
      <canvas id="avatarCanvas"></canvas>
      <div class="topbar">
        <div class="brand">
          <h1>灵小游</h1>
          <span>3D 景区导览助手</span>
        </div>
        <div class="status" id="status">加载中</div>
        <a href="/digital-human-3d/map" class="map-link" title="景区地图">🗺️ 地图</a>
      </div>
    </section>

    <section class="chat" aria-label="对话">
      <div class="chat-head">
        <h2>景区问答</h2>
        <p>支持文字和语音输入，3D 模型会跟随语音口型和情绪变化。</p>
      </div>
      <div class="messages" id="messages"></div>
      <form class="composer" id="composer">
        <button type="button" id="recordBtn" title="语音输入">录音</button>
        <input id="textInput" autocomplete="off" placeholder="输入你想问的问题">
        <button class="primary" id="sendBtn" type="submit">发送</button>
      </form>
    </section>

    <!-- 姿势调节器 -->
    <div class="pose-panel" id="posePanel">
      <div class="pose-toggle" id="poseToggle">⟳ 姿势调节</div>
      <div class="pose-body" id="poseBody" style="display:none">
        <div class="pose-row"><label>左臂 X</label><input type="range" id="lx" min="-2" max="2" step="0.01" value="-0.50"><span id="lxV">-0.50</span></div>
        <div class="pose-row"><label>左臂 Y</label><input type="range" id="ly" min="-2" max="2" step="0.01" value="0.18"><span id="lyV">0.18</span></div>
        <div class="pose-row"><label>左臂 Z</label><input type="range" id="lz" min="-2" max="2" step="0.01" value="-1.14"><span id="lzV">-1.14</span></div>
        <div class="pose-row"><label>左前臂Z</label><input type="range" id="llz" min="-2" max="2" step="0.01" value="0.32"><span id="llzV">0.32</span></div>
        <hr>
        <div class="pose-row"><label>右臂 X</label><input type="range" id="rx" min="-2" max="2" step="0.01" value="-0.17"><span id="rxV">-0.17</span></div>
        <div class="pose-row"><label>右臂 Y</label><input type="range" id="ry" min="-2" max="2" step="0.01" value="-0.05"><span id="ryV">-0.05</span></div>
        <div class="pose-row"><label>右臂 Z</label><input type="range" id="rz" min="-2" max="2" step="0.01" value="1.08"><span id="rzV">1.08</span></div>
        <div class="pose-row"><label>右前臂Z</label><input type="range" id="rlz" min="-2" max="2" step="0.01" value="-0.27"><span id="rlzV">-0.27</span></div>
        <hr>
        <div class="pose-row"><label>手指弯曲</label><input type="range" id="fingerCurl" min="-1.5" max="1.5" step="0.01" value="0.77"><span id="fingerCurlV">0.77</span></div>
        <div class="pose-row"><label>弯曲轴</label><select id="fingerAxis" style="flex:1;background:#1a2a25;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font-size:12px;"><option value="z">Z</option><option value="x">X</option><option value="y">Y</option></select></div>
        <button id="posePrint">📋 打印当前数值</button>
        <button id="poseReset">🔄 重置</button>
      </div>
    </div>

    <!-- 口型测试面板 -->
    <div class="mouth-panel" id="mouthPanel">
      <div class="mouth-toggle" id="mouthToggle">👄 口型测试</div>
      <div class="mouth-body" id="mouthBody">
        <div class="row"><label>aa</label><input type="range" id="m_aa" min="0" max="1" step="0.01" value="0"><span id="m_aaV">0.00</span></div>
        <div class="row"><label>ih</label><input type="range" id="m_ih" min="0" max="1" step="0.01" value="0"><span id="m_ihV">0.00</span></div>
        <div class="row"><label>ou</label><input type="range" id="m_ou" min="0" max="1" step="0.01" value="0"><span id="m_ouV">0.00</span></div>
        <div class="row"><label>ee</label><input type="range" id="m_ee" min="0" max="1" step="0.01" value="0"><span id="m_eeV">0.00</span></div>
        <div class="row"><label>oh</label><input type="range" id="m_oh" min="0" max="1" step="0.01" value="0"><span id="m_ohV">0.00</span></div>
        <hr style="border:none;border-top:1px solid var(--line);margin:8px 0;">
        <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">点字 → 按拼音规则映射口型</div>
        <div class="mouth-grid" id="charGrid">
          <button data-py="a">啊<span class="py">a→aa</span></button>
          <button data-py="ma">妈<span class="py">ma→aa</span></button>
          <button data-py="shan">山<span class="py">shan→aa</span></button>
          <button data-py="i">衣<span class="py">i→ih</span></button>
          <button data-py="ji">机<span class="py">ji→ih</span></button>
          <button data-py="ling">灵<span class="py">ling→ih</span></button>
          <button data-py="e">饿<span class="py">e→ee</span></button>
          <button data-py="ye">夜<span class="py">ye→ee</span></button>
          <button data-py="feng">风<span class="py">feng→ee</span></button>
          <button data-py="o">哦<span class="py">o→oh</span></button>
          <button data-py="wo">我<span class="py">wo→oh</span></button>
          <button data-py="gong">宫<span class="py">gong→oh</span></button>
          <button data-py="u">乌<span class="py">u→ou</span></button>
          <button data-py="fo">佛<span class="py">fo→oh</span></button>
          <button data-py="you">游<span class="py">you→ou</span></button>
          <button data-py="hao">好<span class="py">hao→aa</span></button>
        </div>
        <div class="mouth-actions">
          <button id="mouthMode" title="冻结模式: 关闭说话/动画对口型的覆盖">🔒 冻结</button>
          <button id="mouthClear">↺ 归零</button>
        </div>
      </div>
    </div>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "/digital-human-3d/vendor/three/build/three.module.js",
        "three/addons/": "/digital-human-3d/vendor/three/examples/jsm/",
        "@pixiv/three-vrm": "/digital-human-3d/vendor/three-vrm/three-vrm.module.js"
      }
    }
  </script>

  <script type="module">

    import { LipSyncAnalyzer, VrmLipSyncDriver } from "/digital-human-3d/lipsync.js?v=mouth-plus-20260617b";

    // ── 新版口型同步: 频谱共振峰识别 + 攻击释放平滑 + 文本先验融合 ──

    // 由 speak() 写入, buildMouthTimeline 优先使用; 没有时退化到本地小字典
    let serverPinyinTrack = null;

    const canvas = document.getElementById("avatarCanvas");

    const input = document.getElementById("textInput");
    const sendBtn = document.getElementById("sendBtn");
    const recordBtn = document.getElementById("recordBtn");
    const statusEl = document.getElementById("status");

    let mediaRecorder = null;
    let chunks = [];
    let busy = false;
    let audioContext = null;
    let analyser = null;
    let audioSource = null;

    let mouthValue = 0;

    let currentAudioUrl = "";
    let gestureState = "idle";
    let interactionState = "idle";
    let thinkingBlend = 0;
    let nextShiftAt = 0;
    let bodyShiftTarget = { headX: 0, headY: 0, headZ: 0, chestX: 0, chestY: 0 };
    let bodyShiftCurrent = { headX: 0, headY: 0, headZ: 0, chestX: 0, chestY: 0 };
    let gesturePhase = "idle";
    let gestureStartMs = 0;
    let gestureRiseMs = 0;
    let gestureHoldMs = 0;
    let lastEnergyPeak = 0;
    let armRestZ = 0;
    const expressionTargets = new Map();
    const expressionValues = new Map();
    const availableExpressions = new Set();
    const EXPRESSION_NAMES = ["happy", "angry", "sad", "relaxed", "surprised", "aa", "ih", "ou", "ee", "oh", "mbp", "fv", "szh", "chsh", "blink", "blinkLeft", "blinkRight"];
    const EMOTION_NAMES = ["happy", "sad", "surprised", "angry", "relaxed"];
    const MOUTH_NAMES = ["aa", "ih", "ou", "ee", "oh", "mbp", "fv", "szh", "chsh"];
    const BASE_MOUTH_NAMES = ["aa", "ih", "ou", "ee", "oh"];
    const NAV_LOCATION_KEY = "lingshanGuideCurrentLocation";
    const NAV_ROUTE_KEY = "lingshanGuideActiveRoute";
    const NAV_TARGET_KEY = "lingshanGuideTargetSpot";

    const PINYIN_HINTS = new Map([

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 30);
    camera.position.set(0, 1.35, 3.0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.25, 0);
    controls.enableDamping = true;
    controls.enablePan = false;
    controls.minDistance = 1.6;
    controls.maxDistance = 4.4;

    scene.add(new THREE.AmbientLight(0xffffff, 1.35));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(1.8, 3.2, 2.4);
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0x88ffe0, 1.1);
    rimLight.position.set(-2.4, 2.0, -1.2);
    scene.add(rimLight);

    const clock = new THREE.Clock();
    const data = new Uint8Array(128);

    function setStatus(text) {
      statusEl.textContent = text;
    }

    window.__LINGXIAOYOU_DEBUG__ = {
      getState() {
        return {
          status: statusEl.textContent,
          interactionState,
          targetEmotion,
          gestureState,
          mouthValue,
          hasVrm: Boolean(currentVrm),
          hasLipSync: Boolean(lipsyncDriver),
          availableExpressions: Array.from(availableExpressions),
        };
      },
      getExpressions() {
        const names = [...EMOTION_NAMES, ...MOUTH_NAMES, "blink", "blinkLeft", "blinkRight"];
        const out = {};
        for (const name of names) {
          try {
            const manager = currentVrm?.expressionManager;
            const value = manager?.getValue?.(name);
            out[name] = value ?? manager?.getExpression?.(name)?.weight ?? null;
          } catch (_) {
            out[name] = null;
          }
        }
        return out;
      },
      getLipSync() {
        return {
          bias: lipsyncDriver ? { ...lipsyncDriver.bias } : null,
          current: lipsyncDriver ? { ...lipsyncDriver.current } : null,
          available: lipsyncDriver ? Array.from(lipsyncDriver.available) : [],
          timelineIndex: mouthTimelineIndex,
          timelineLength: mouthTimeline.length,
          timelineCue: mouthTimeline[mouthTimelineIndex] || null,
          speechText: lastSpeechText,
        };
      },
    };

    function addBubble(role, text) {
      const div = document.createElement("div");
      div.className = `bubble ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setBusy(next) {
      busy = next;
      sendBtn.disabled = next;
      input.disabled = next;
      recordBtn.disabled = next && !mediaRecorder;
    }

    function clamp(value, min = 0, max = 1) {
      return Math.max(min, Math.min(max, value));
    }

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      renderer.setSize(rect.width, rect.height, false);
      camera.aspect = rect.width / Math.max(1, rect.height);
      camera.updateProjectionMatrix();
    }

    function setExpression(name, value) {
      if (!currentVrm || !currentVrm.expressionManager) return;
      if (!availableExpressions.has(name)) return;
      currentVrm.expressionManager.setValue(name, clamp(value));
    }

    function setExpressionTarget(name, value) {
      if (!availableExpressions.has(name)) return;
      expressionTargets.set(name, clamp(value));
    }

    function hideWhiteBaseMesh(root) {
      const hidden = [];
      root.updateMatrixWorld(true);
      root.traverse((obj) => {
        if (!obj.isMesh || !obj.geometry) return;
        const nodeName = (obj.name || "").toLowerCase();
        if (nodeName === "cube") {
          obj.visible = false;
          hidden.push({
            name: obj.name || "(unnamed)",
            reason: "matched node name",
          });
          return;
        }
        if (!obj.geometry.boundingBox) obj.geometry.computeBoundingBox();
        const box = obj.geometry.boundingBox;
        if (!box) return;

        const size = new THREE.Vector3();
        const center = new THREE.Vector3();
        box.getSize(size);
        box.getCenter(center);
        center.applyMatrix4(obj.matrixWorld);

        const materials = Array.isArray(obj.material) ? obj.material : [obj.material];
        const hasMostlyWhiteMaterial = materials.some((mat) => {
          const color = mat?.color;
          if (!color) return false;
          return color.r > 0.82 && color.g > 0.82 && color.b > 0.82;
        });

        const looksLikeBasePlane =
          size.x > 1.2 &&
          size.z > 1.2 &&
          size.y < 0.55 &&
          center.y < 0.8;

        const definitelyPlatform =
          size.x > 2.2 &&
          size.z > 2.2 &&
          size.y < 0.9 &&
          center.y < 1.0;

        if (!looksLikeBasePlane && !definitelyPlatform) return;
        if (!hasMostlyWhiteMaterial && !definitelyPlatform) return;
        obj.visible = false;
        hidden.push({
          name: obj.name || "(unnamed)",
          reason: "matched platform heuristic",
          size: [size.x.toFixed(2), size.y.toFixed(2), size.z.toFixed(2)].join(", "),
          y: center.y.toFixed(2),
        });
      });
      if (hidden.length) console.log("[VRM] 已隐藏白色底面:", hidden);
    }

    function tintHairBlack(root) {
      const tinted = [];
      root.traverse((obj) => {
        if (!obj.isMesh || !obj.material) return;
        const nodeName = (obj.name || "").toLowerCase();
        const materials = Array.isArray(obj.material) ? obj.material : [obj.material];
        materials.forEach((mat) => {
          const matName = (mat?.name || "").toLowerCase();
          const looksLikeHair = nodeName.includes("hair") || matName.includes("hair");
          if (!looksLikeHair || !mat?.color) return;
          mat.color.setRGB(0.02, 0.02, 0.025);
          if ("emissive" in mat && mat.emissive) mat.emissive.setRGB(0, 0, 0);
          if ("emissiveIntensity" in mat) mat.emissiveIntensity = 0;
          if ("toneMapped" in mat) mat.toneMapped = false;
          if ("roughness" in mat) mat.roughness = Math.max(0.75, mat.roughness ?? 0.75);
          if ("metalness" in mat) mat.metalness = Math.min(0.05, mat.metalness ?? 0.0);
          if ("vertexColors" in mat) mat.vertexColors = false;
          if (mat.userData?.gltfExtensions?.VRMC_materials_mtoon) {
            const mtoon = mat.userData.gltfExtensions.VRMC_materials_mtoon;
            mtoon.shadeColorFactor = [0.02, 0.02, 0.025];
            mtoon.parametricRimColorFactor = [0, 0, 0];
            mtoon.rimLightingMixFactor = 0;
            mtoon.matcapFactor = [0, 0, 0];
          }
          mat.needsUpdate = true;
          tinted.push({ node: obj.name || "(unnamed)", material: mat.name || "(unnamed)" });
        });
      });
      if (tinted.length) console.log("[VRM] 已将头发染成黑色:", tinted);
    }

    function updateExpressionTargets(delta) {
      if (!currentVrm) return;
      const emotionSpeed = 1 - Math.pow(0.003, delta);
      const blinkSpeed = 1 - Math.pow(0.0001, delta);
      for (const name of availableExpressions) {
        // 口型 (aa/ih/ou/ee/oh) 由 lipsyncDriver 直接写入 vrm.expressionManager,
        // 这里绝对不能再用本地缓存覆盖, 否则嘴会被强制归零
        if (MOUTH_NAMES.includes(name)) continue;
        const current = expressionValues.get(name) || 0;
        const target = expressionTargets.get(name) || 0;
        const speed = name.startsWith("blink") ? blinkSpeed : emotionSpeed;
        const next = current + (target - current) * speed;
        expressionValues.set(name, Math.abs(next) < 0.001 ? 0 : next);
        setExpression(name, expressionValues.get(name));
      }
    }

    function resetExpressions() {
      EXPRESSION_NAMES.forEach((name) => {
        setExpressionTarget(name, 0);
        expressionValues.set(name, 0);
        setExpression(name, 0);
      });
    }

    // ── 情绪检测: 关键词加权打分 ──
    // 设计原则:
    //   1. 默认情绪是 idle (返回 happy 的低强度版本) — 数字人导游始终带笑容
    //   2. 触发其它情绪需要至少 2 分, 避免一个标点就乱飘
    //   3. 同时多个情绪命中时取最高分, 平局时按 sad > surprised > relaxed > happy 优先
    //   4. "天气"、"!" 这些常规词不再单独触发惊讶, 必须配合"竟然/真的吗/没想到"才算
    const EMOTION_LEXICON = {
      sad: [
        [/抱歉|不好意思|对不起/, 3],
        [/无法|不能|没办法|没.{0,2}查到|没.{0,2}找到/, 2],
        [/失败|错误|出错|异常/, 2],
        [/遗憾|可惜|惋惜|心疼/, 3],
        [/关闭|停运|停业|暂停/, 2],
      ],
      surprised: [
        [/竟然|居然|没想到|真没想到/, 3],
        [/天哪|我的天|哎呀|哇/, 3],
        [/真的吗|不会吧|这么.{0,2}厉害|惊人/, 3],
        [/紧急|警告|危险/, 3],
        [/特别注意|尤其要|千万要/, 2],
      ],
      relaxed: [
        [/建议|推荐|可以先|不妨|可以试试/, 2],
        [/如果|假如|要是|倘若/, 1],
        [/根据|按照|依据/, 1],
        [/规划|安排|考虑/, 2],
        [/慢慢|从容|放心|别着急/, 2],
        [/让我.{0,2}看看|稍等|思考.{0,2}下/, 2],
      ],
      happy: [
        [/欢迎|您好|你好|很高兴|幸会/, 3],
        [/祝.{0,3}愉快|玩.{0,2}开心|希望.{0,3}喜欢/, 3],
        [/精彩|精美|壮观|宏伟|庄严|绝美/, 2],
        [/代表性|地标|必看|必游|不容错过/, 2],
        [/谢谢|不客气|没问题|当然.{0,2}可以/, 2],
        [/适合|很棒|不错|很好/, 1],
        [/😄|😊|🙂|✨|🎉/, 2],
      ],
      angry: [
        [/严禁|禁止|不许|不要.{0,2}(打扰|喧哗|乱)/, 2],
        [/请勿|不得|违反/, 2],
      ],
    };

    function scoreEmotion(text) {
      const scores = { sad: 0, surprised: 0, relaxed: 0, happy: 0, angry: 0 };
      for (const [emo, rules] of Object.entries(EMOTION_LEXICON)) {
        for (const [re, weight] of rules) {
          if (re.test(text)) scores[emo] += weight;
        }
      }
      return scores;
    }

    function detectEmotion(text, fallback = "happy") {
      if (!text) return fallback;
      const scores = scoreEmotion(text);
      // 触发阈值: 2 分以上才认为有明确情绪
      const threshold = 2;
      const order = ["sad", "surprised", "angry", "relaxed", "happy"];
      let best = null, bestScore = threshold - 1;
      for (const emo of order) {
        if (scores[emo] > bestScore) {
          bestScore = scores[emo];
          best = emo;
        }
      }
      return best || fallback;
    }

    function detectGestureFromText(text, emotion = "") {
      if (emotion === "surprised" || /注意|提醒|天气|下雨|调整/.test(text)) return "alert";
      if (emotion === "sad" || /抱歉|无法|失败|遗憾/.test(text)) return "soft";
      if (/路线|先|随后|然后|入口|附近|位置|到|推荐/.test(text)) return "point";
      if (/介绍|因为|代表|文化|历史|建议|可以/.test(text)) return "explain";
      if (/你好|欢迎|我是|很高兴/.test(text)) return "welcome";
      return "idle";
    }

    // 表情强度配置: 基础值用于"说话中", idle 值用于"待机"
    // 数字人导游基调是友好, 所以 idle 也保留低强度微笑
    const EMOTION_PROFILES = {
      happy:     { active: { happy: 0.55, relaxed: 0.10 },                idle: { happy: 0.32, relaxed: 0.08 } },
      relaxed:   { active: { relaxed: 0.40, happy: 0.10 },                idle: { relaxed: 0.18, happy: 0.18 } },
      surprised: { active: { surprised: 0.45, happy: 0.06 },              idle: { happy: 0.26, relaxed: 0.06 } },
      sad:       { active: { sad: 0.45, relaxed: 0.05 },                  idle: { sad: 0.18, relaxed: 0.05 } },
      angry:     { active: { angry: 0.40 },                               idle: { angry: 0.15 } },
      neutral:   { active: { happy: 0.20 },                               idle: { happy: 0.20 } },  // 兜底也带浅笑
    };

    function applyEmotion(name, gesture = "", { idle = false } = {}) {
      // idle=true: 用低强度版本, 给"待机/听话"用; idle=false: 说话中的强表情
      const profile = EMOTION_PROFILES[name] || EMOTION_PROFILES.happy;
      const values = idle ? profile.idle : profile.active;
      targetEmotion = name;
      gestureState = gesture || (idle ? "idle" : name);
      lastEnergyPeak = 0;
      gesturePhase = "idle";
      // 先把所有情绪清零, 再写当前 profile (避免上一次残留)
      EMOTION_NAMES.forEach((emo) => setExpressionTarget(emo, values[emo] || 0));
    }

    function setThinkingPose(active) {
      const isAudioPlaying = currentAudio && !currentAudio.paused && !currentAudio.ended;
      interactionState = active ? "thinking" : (isAudioPlaying ? "speaking" : "idle");
      if (!active) {
        if (!isAudioPlaying) gestureState = "idle";
        nextShiftAt = 0;
      }
      if (active) {
        setExpressionTarget("happy", 0.14);
        setExpressionTarget("sad", 0);
        setExpressionTarget("surprised", 0);
        setExpressionTarget("relaxed", 0.22);
      }
    }

    function updateMouth(viseme) {
      const next = {};
      for (const name of MOUTH_NAMES) next[name] = clamp(viseme[name] || 0);
      mouthValue = mouthValue * 0.65 + Math.max(...MOUTH_NAMES.map((name) => next[name] || 0)) * 0.35;
      for (const name of MOUTH_NAMES) {
        const value = next[name] || 0;
        setExpressionTarget(name, value);
      }
    }

    function emptyViseme(hold = 120) {
      const viseme = { hold };
      for (const name of MOUTH_NAMES) viseme[name] = 0;
      return viseme;
    }

    function makeViseme(name, hold = 128, amount = 1) {
      const viseme = emptyViseme(hold);
      if (MOUTH_NAMES.includes(name)) viseme[name] = amount;
      return viseme;
    }

    function normalizeViseme(viseme, amount = 1) {
      const max = Math.max(...MOUTH_NAMES.map((name) => viseme[name] || 0));
      if (max <= 0.001) return emptyViseme(viseme.hold || 120);
      const out = { hold: viseme.hold || 128 };
      for (const name of MOUTH_NAMES) out[name] = clamp((viseme[name] || 0) / max * amount);
      return out;
    }

    function updateBlink(now) {
      if (now > blinkAt) {
        blinkAt = now + 2.5 + Math.random() * 3.5;
        blinkAmount = 1;
      }
      blinkAmount *= 0.72;
      setExpressionTarget("blink", blinkAmount);
      setExpressionTarget("blinkLeft", blinkAmount);
      setExpressionTarget("blinkRight", blinkAmount);
    }

    function inferPinyin(char) {
      if (PINYIN_HINTS.has(char)) return PINYIN_HINTS.get(char);
      if (/[a-z]/i.test(char)) return char.toLowerCase();
      if (/[，。！？、；：,.!?;:\s]/.test(char)) return "";
      return "a";
    }

    function pinyinToViseme(pinyin) {
      // 普通话拼音 → 5 元音口型 (aa/ih/ou/ee/oh) 完整规则
      // 设计原则:
      //   1. 韵腹 (主元音) 决定口型, 韵头/韵尾只调时长和小幅过渡
      //   2. 双唇/唇齿声母 (b p m f) 起始有 ~70ms 闭口段, 然后切到韵腹
      //   3. 整体 hold 时长按韵母开度调整: a 类最长, i/u 略短, 鼻韵尾再加 20ms
      if (!pinyin) return emptyViseme(130);
      let py = pinyin.toLowerCase().replace(/[^a-zü]/g, "").replace(/v/g, "ü");
      if (!py) return emptyViseme(130);

      // 1. 剥声母 (双字母在前, 单字母在后)
      const initials = ["zh", "ch", "sh", "b", "p", "m", "f", "d", "t", "n", "l",
                        "g", "k", "h", "j", "q", "x", "z", "c", "s", "r", "y", "w"];
      let initial = "";
      for (const ini of initials) {
        if (py.startsWith(ini)) { initial = ini; break; }
      }
      let final = py.slice(initial.length);
      // y/w 是隐式 i/u 起头, 还原一下韵母
      if (initial === "y" && !final.startsWith("i") && !final.startsWith("ü")) {
        final = (final === "u") ? "ü" : "i" + final;
      }
      if (initial === "w" && !final.startsWith("u")) final = "u" + final;
      // 整体音节 zhi/chi/shi/ri/zi/ci/si 韵母实读 ɿ/ʅ, 当 ih
      if (!final && /(zh|ch|sh|r|z|c|s)/.test(initial)) final = "ih_special";

      // 2. 提取韵腹 (主元音) — 优先级: 长元音 > 单元音
      // 顺序很关键: ang/eng/ing/ong 必须比 a/e/i/o 先匹配
      const FINAL_RULES = [
        // 复韵母 / 鼻韵母 — 用韵腹决定口型
        { re: /^iang$|^iao$|^ian$|^ia$/,           viseme: "aa", hold: 158 },  // 韵腹 a
        { re: /^uang$|^uan$|^uai$|^ua$/,           viseme: "aa", hold: 158 },
        { re: /^ang$|^ai$|^an$|^ao$|^a$/,          viseme: "aa", hold: 152 },
        { re: /^ueng$|^ong$/,                      viseme: "oh", hold: 144 },  // 韵腹 o (鼻化)
        { re: /^iong$/,                            viseme: "oh", hold: 144 },
        { re: /^uo$|^o$/,                          viseme: "oh", hold: 138 },  // 真正的 o/uo → oh
        { re: /^ou$/,                              viseme: "ou", hold: 140 },  // ou → 圆唇收
        { re: /^iu$|^iou$/,                        viseme: "ou", hold: 132 },
        { re: /^ui$|^uei$/,                        viseme: "ee", hold: 130 },  // 收尾 i, 主元音 ei
        { re: /^ei$|^en$|^eng$/,                   viseme: "ee", hold: 134 },
        { re: /^ie$|^üe$|^ue$/,                    viseme: "ee", hold: 128 },  // 韵腹 ê
        { re: /^er$|^e$/,                          viseme: "ee", hold: 132 },
        { re: /^ing$|^in$|^i$|^ih_special$/,       viseme: "ih", hold: 124 },
        { re: /^ün$|^ü$|^ü.*/,                     viseme: "ou", hold: 134 },  // ü 圆唇前
        { re: /^un$|^u$/,                          viseme: "ou", hold: 132 },
      ];

      let viseme = null;
      for (const rule of FINAL_RULES) {
        if (rule.re.test(final)) {
          viseme = makeViseme(rule.viseme, rule.hold, 0.92);
          break;
        }
      }
      if (!viseme) viseme = makeViseme("aa", 130, 0.7);

      // 3. 双唇/唇齿声母在韵母前插入短促准备段。
      // VRM 只有 5 个元音表情, 没有真正的 mbp/fv 形变, 这里用"闭嘴/轻 ih"近似辅音过渡。
      if (/^[bpm]/.test(initial)) {
        viseme.consonant = "mbp";
        viseme.consonantAmount = 1.0;
        viseme.pre = { ...emptyViseme(48), mbp: 1, hold: 48, closed: true };
      } else if (initial === "f") {
        viseme.consonant = "fv";
        viseme.consonantAmount = 0.85;
        viseme.pre = { ...emptyViseme(44), fv: 0.85, ih: 0.18, hold: 44 };
      } else if (/^(z|c|s|zh|ch|sh|r|j|q|x)$/.test(initial)) {
        const consonantShape = /^(zh|ch|sh|r)$/.test(initial) ? "chsh" : "szh";
        viseme.consonant = consonantShape;
        viseme.consonantAmount = 0.8;
        viseme.pre = { ...emptyViseme(36), [consonantShape]: 0.8, ih: 0.22, hold: 36 };
      }
      if (/^[bpmf]/.test(initial)) {
        for (const k of MOUTH_NAMES) {
          if (viseme[k]) viseme[k] *= 0.85;
        }
      }
      return viseme;
    }

    function buildMouthTimeline(text, durationMs = 0) {
      // 优先用后端 pypinyin 给的精确拼音; 没有再退化到本地 80 字字典
      let cues;
      if (serverPinyinTrack && serverPinyinTrack.length) {
        cues = serverPinyinTrack.slice(0, 500).flatMap((item) => {
          if (item.rest || !item.py) {
            return [{ ...emptyViseme(80), rest: true }];
          }
          const cue = pinyinToViseme(item.py);
          return cue.pre ? [cue.pre, cue] : [cue];
        });
      } else {
        const chars = Array.from(text.replace(/https?:\/\/\S+/g, "").replace(/\s+/g, " ")).slice(0, 500);
        cues = chars.flatMap((char) => {
          const cue = pinyinToViseme(inferPinyin(char));
          if (/[，。！？、；：,.!?;:\s]/.test(char)) {
            return [{ ...cue, rest: true }];
          }
          return cue.pre ? [cue.pre, cue] : [cue];
        });
      }
      const total = cues.reduce((sum, cue) => sum + cue.hold, 0) || 1;
      const scale = durationMs ? clamp(durationMs / total, 0.55, 2.1) : 1;
      let cursor = 0;
      mouthTimelineIndex = 0;
      return cues.map((cue, index) => {
        const start = cursor;
        const end = start + cue.hold * scale;
        cursor = end;
        return { ...cue, start, end, index };
      });
    }

    function getTimelineViseme(ms) {
      if (!mouthTimeline.length) return emptyViseme();
      while (
        mouthTimelineIndex < mouthTimeline.length - 1 &&
        ms >= mouthTimeline[mouthTimelineIndex].end
      ) {
        mouthTimelineIndex += 1;
      }
      while (mouthTimelineIndex > 0 && ms < mouthTimeline[mouthTimelineIndex].start) {
        mouthTimelineIndex -= 1;
      }
      const cue = mouthTimeline[mouthTimelineIndex] || mouthTimeline[mouthTimeline.length - 1];
      const span = Math.max(1, cue.end - cue.start);
      const progress = clamp((ms - cue.start) / span);
      const prev = mouthTimeline[Math.max(0, mouthTimelineIndex - 1)] || emptyViseme();
      const next = mouthTimeline[Math.min(mouthTimeline.length - 1, mouthTimelineIndex + 1)] || emptyViseme();
      const inMix = clamp((0.18 - progress) / 0.18);
      const outMix = clamp((progress - 0.78) / 0.22);
      const base = 1 - Math.max(inMix, outMix);
      const envelope = Math.min(clamp(progress / 0.16), clamp((1 - progress) / 0.14));
      const mixed = {};
      for (const name of MOUTH_NAMES) {
        mixed[name] = (cue[name] || 0) * base + (prev[name] || 0) * inMix + (next[name] || 0) * outMix;
      }
      let consonantBoost = null;
      if (cue.consonant && MOUTH_NAMES.includes(cue.consonant)) {
        const consonantEnvelope = clamp((0.42 - progress) / 0.42);
        consonantBoost = {
          name: cue.consonant,
          value: (cue.consonantAmount || 0.7) * consonantEnvelope,
        };
        mixed[cue.consonant] = Math.max(mixed[cue.consonant] || 0, consonantBoost.value);
      }
      const out = normalizeViseme(mixed, envelope * 0.92);
      if (consonantBoost) {
        out[consonantBoost.name] = Math.max(out[consonantBoost.name] || 0, consonantBoost.value * 0.72);
      }
      return out;
    }

    function mixVisemeWithEnergy(viseme, energy, elapsed) {
      const shapeOpen = Math.max(...MOUTH_NAMES.map((name) => viseme[name] || 0));
      if (shapeOpen <= 0.001 || energy < 0.018) return emptyViseme();
      const pulse = Math.sin(elapsed / 86) * 0.025 + Math.sin(elapsed / 137) * 0.014;
      const intensity = clamp(0.28 + energy * 1.15 + pulse, 0.18, 1);
      return normalizeViseme(viseme, shapeOpen * intensity);
    }

    function expressionExists(manager, name) {
      if (!manager) return false;
      try {
        if (typeof manager.getExpression === "function" && manager.getExpression(name)) return true;
        if (typeof manager.getExpressionTrackName === "function" && manager.getExpressionTrackName(name)) return true;
      } catch (error) {
        return false;
      }
      return false;
    }

    function stopCurrentAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.removeAttribute("src");
        currentAudio.load();
        currentAudio = null;
      }
      if (audioSource) {
        try {
          audioSource.disconnect();
        } catch (error) {
          // The node may already be disconnected after playback ends.
        }
        audioSource = null;
      }
      // 释放 LipSyncAnalyzer 内的 source 节点 (analyser 本身复用)
      if (lipsyncAnalyzer) lipsyncAnalyzer.reset();
      // 嘴部缓动归零 (immediate=false 让其自然闭合)
      if (lipsyncDriver) lipsyncDriver.silence(false);
      analyser = null;
      if (currentAudioUrl) {
        URL.revokeObjectURL(currentAudioUrl);
        currentAudioUrl = "";
      }
      mouthTimeline = [];
      mouthTimelineIndex = 0;
      serverPinyinTrack = null;
      updateMouth({});
    }

    function bone(name) {
      return currentVrm?.humanoid?.getNormalizedBoneNode(name) || null;
    }

    function setBoneRotation(name, x = 0, y = 0, z = 0) {
      const node = bone(name);
      if (node) node.rotation.set(x, y, z);
    }

    function applyBasePose() {
      setBoneRotation("leftUpperArm", -0.50, 0.18, -1.14);
      setBoneRotation("rightUpperArm", -0.17, -0.05, 1.08);
      setBoneRotation("leftLowerArm", 0.0, 0.08, 0.32);
      setBoneRotation("rightLowerArm", 0.0, -0.08, -0.27);
      setBoneRotation("leftHand", 0.0, 0.0, 0.0);
      setBoneRotation("rightHand", 0.0, 0.0, 0.0);
      setBoneRotation("chest", 0.0, 0, 0);
      setBoneRotation("spine", 0.0, 0, 0);
      curlFingers("left", 0.77, "z");
      curlFingers("right", 0.77, "z");
      armRestZ = -1.14;
    }

    function curlFingers(side, amount, axis) {
      const ax = axis || "z";
      // 左右手镜像：左手取反
      const dir = side === "left" ? -1 : 1;
      const val = amount * dir;
      const v = (s) => {
        const r = [0, 0, 0];
        if (ax === "x") r[0] = s; else if (ax === "y") r[1] = s; else r[2] = s;
        return r;
      };
      const fingers = ["Index", "Middle", "Ring", "Little"];
      for (const finger of fingers) {
        setBoneRotation(`${side}${finger}Proximal`, ...v(val));
        setBoneRotation(`${side}${finger}Intermediate`, ...v(val * 0.7));
        setBoneRotation(`${side}${finger}Distal`, ...v(val * 0.4));
      }
      setBoneRotation(`${side}ThumbProximal`, ...v(val * 0.5));
      setBoneRotation(`${side}ThumbIntermediate`, ...v(val * 0.4));
      setBoneRotation(`${side}ThumbDistal`, ...v(val * 0.3));
    }

    function updateBodyMotion(now, deltaSec, speaking) {
      if (!currentVrm) return;

      const energy = speaking ? clamp(mouthValue * 1.2 + 0.12) : 0;
      const nowMs = now * 1000;
      deltaSec = Math.min(0.1, deltaSec || 0.016);

      // ── thinking 平滑过渡 ──
      const thinkingTarget = interactionState === "thinking" ? 1 : 0;
      thinkingBlend += (thinkingTarget - thinkingBlend) * Math.min(1, deltaSec * 3.5);
      thinkingBlend = clamp(thinkingBlend);

      // ── 待机微动：随机间隔触发，平滑 lerp ──
      if (!speaking && thinkingBlend < 0.05) {
        if (nowMs > nextShiftAt) {
          nextShiftAt = nowMs + 1800 + Math.random() * 3500;
          bodyShiftTarget = {
            headX: (Math.random() - 0.5) * 0.025,
            headY: (Math.random() - 0.5) * 0.03,
            headZ: (Math.random() - 0.5) * 0.02,
            chestX: (Math.random() - 0.5) * 0.01,
            chestY: (Math.random() - 0.5) * 0.015,
          };
        }
      } else {
        // 说话/思考时不触发大位移，保持稳定
        bodyShiftTarget = { headX: 0, headY: 0, headZ: 0, chestX: 0, chestY: 0 };
      }

      // 平滑趋近微动目标
      const lerpSpeed = 1 - Math.pow(0.0008, deltaSec);
      for (const key of ["headX", "headY", "headZ", "chestX", "chestY"]) {
        bodyShiftCurrent[key] += (bodyShiftTarget[key] - bodyShiftCurrent[key]) * lerpSpeed;
      }

      // ── 说话手势状态机 ──
      if (speaking && energy > 0.2) {
        if (gesturePhase === "idle" && nowMs - lastEnergyPeak > 600) {
          // 检测到能量，触发新手势
          gesturePhase = "rising";
          gestureStartMs = nowMs;
          gestureRiseMs = 180 + Math.random() * 150;
          gestureHoldMs = 400 + Math.random() * 800;
          lastEnergyPeak = nowMs;
        } else if (gesturePhase === "rising" && nowMs - gestureStartMs > gestureRiseMs) {
          gesturePhase = "holding";
          gestureStartMs = nowMs;
        } else if (gesturePhase === "holding" && nowMs - gestureStartMs > gestureHoldMs) {
          gesturePhase = "falling";
          gestureStartMs = nowMs;
        } else if (gesturePhase === "falling" && nowMs - gestureStartMs > 350) {
          gesturePhase = "idle";
        }
      } else if (!speaking) {
        gesturePhase = "idle";
      }

      // 手势强度：上升期快进，保持期平稳，下降期缓出
      let gestureAlpha = 0;
      if (gesturePhase === "rising") {
        gestureAlpha = clamp((nowMs - gestureStartMs) / gestureRiseMs);
      } else if (gesturePhase === "holding") {
        gestureAlpha = 1;
      } else if (gesturePhase === "falling") {
        gestureAlpha = 1 - clamp((nowMs - gestureStartMs) / 350);
      }

      const gestureEnergy = gestureAlpha * energy * 0.65;
      const isPointing = gestureState === "point";
      const isWelcoming = gestureState === "welcome";
      const isExplaining = gestureState === "explain";
      const isAlerting = gestureState === "alert";
      const isSad = gestureState === "soft" || targetEmotion === "sad";

      // ── 头部 ──
      const head = bone("head");
      if (head) {
        const thinkTilt = thinkingBlend * 0.14;
        const thinkYaw = thinkingBlend * Math.sin(now * 0.7) * 0.04;
        const nod = speaking ? Math.sin(now * 3.8) * energy * 0.025 : 0;
        const sadBow = isSad ? -0.03 : 0;
        head.rotation.x = bodyShiftCurrent.headX + thinkTilt + nod + sadBow + 0.01;
        head.rotation.y = bodyShiftCurrent.headY + thinkYaw + (isPointing ? 0.04 : 0);
        head.rotation.z = bodyShiftCurrent.headZ + (thinkingBlend * 0.03);
      }

      // ── 胸部和脊柱：仅呼吸 ──
      const chest = bone("chest");
      if (chest) {
        const breathe = Math.sin(now * 1.4) * 0.012;
        chest.rotation.x = bodyShiftCurrent.chestX + breathe + (speaking ? 0.01 : 0);
        chest.rotation.y = bodyShiftCurrent.chestY;
        chest.rotation.z = 0;
      }

      const spine = bone("spine");
      if (spine) {
        spine.rotation.x = Math.sin(now * 1.4) * 0.007;
        spine.rotation.y = 0;
      }

      // ── 手臂：基础放松 + 说话时短促手势 ──
      const leftUpper = bone("leftUpperArm");
      const rightUpper = bone("rightUpperArm");
      const leftLower = bone("leftLowerArm");
      const rightLower = bone("rightLowerArm");

      // 思考时手靠近脸部
      const thinkArmX = thinkingBlend * 0.25;
      const thinkArmZ = thinkingBlend * 0.06;

      // 情绪对手臂的轻微影响
      const happyOpen = targetEmotion === "happy" ? 0.03 : 0;
      const surprisedUp = targetEmotion === "surprised" ? 0.04 : 0;
      const sadClose = isSad ? -0.04 : 0;

      // 手势方向偏移
      const pointForward = isPointing ? 0.06 : 0;
      const welcomeOpen = isWelcoming ? 0.05 : 0;

      if (leftUpper) {
        leftUpper.rotation.x = -0.50 + thinkArmX + happyOpen + surprisedUp + sadClose + gestureEnergy * 0.1 + pointForward;
        leftUpper.rotation.y = 0.18 - welcomeOpen * 0.3;
        leftUpper.rotation.z = armRestZ + gestureEnergy * 0.12 + thinkArmZ + (isPointing ? -0.05 : 0);
      }
      if (rightUpper) {
        rightUpper.rotation.x = -0.17 + thinkArmX * 0.7 + happyOpen * 0.7 + surprisedUp * 0.8 + sadClose + gestureEnergy * 0.07;
        rightUpper.rotation.y = -0.05 + welcomeOpen * 0.3;
        rightUpper.rotation.z = -armRestZ - gestureEnergy * 0.12 - thinkArmZ + (isPointing ? 0.06 : 0);
      }
      if (leftLower) {
        leftLower.rotation.x = gestureEnergy * 0.03;
        leftLower.rotation.y = 0.08;
        leftLower.rotation.z = 0.32 + gestureEnergy * 0.04;
      }
      if (rightLower) {
        rightLower.rotation.x = gestureEnergy * 0.04;
        rightLower.rotation.y = -0.08;
        rightLower.rotation.z = -0.27 - gestureEnergy * 0.04;
      }

      // ── 手 ──
      const leftHand = bone("leftHand");
      const rightHand = bone("rightHand");
      if (leftHand) leftHand.rotation.z = gestureEnergy * 0.04;
      if (rightHand) rightHand.rotation.z = -gestureEnergy * 0.04;
    }

    async function loadVrm() {
      const loader = new GLTFLoader();
      loader.register((parser) => new VRMLoaderPlugin(parser));
      const gltf = await loader.loadAsync("/digital-human-3d/assets/model.vrm");
      const vrm = gltf.userData.vrm;
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.removeUnnecessaryJoints(gltf.scene);
      currentVrm = vrm;
      window.currentVrm = vrm;
      scene.add(vrm.scene);
      vrm.scene.rotation.y = 0;
      vrm.scene.position.set(0, 0, 0);
      hideWhiteBaseMesh(vrm.scene);
      tintHairBlack(vrm.scene);
      const manager = vrm.expressionManager;
      EXPRESSION_NAMES.forEach((name) => {
        if (expressionExists(manager, name)) {
          availableExpressions.add(name);
          expressionTargets.set(name, 0);
          expressionValues.set(name, 0);
        }
      });
      // 诊断: 列出 VRM 实际可用的表情, 重点看 aa/ih/ou/ee/oh 是否都在
      const vis = MOUTH_NAMES.filter((n) => availableExpressions.has(n));
      const emo = EMOTION_NAMES.filter((n) => availableExpressions.has(n));
      console.log("[VRM] 可用表情清单:", Array.from(availableExpressions));
      console.log("[VRM] 口型 (viseme):", vis.length ? vis.join(", ") : "❌ 缺失, 嘴不会动");
      console.log("[VRM] 情绪:", emo.length ? emo.join(", ") : "(无)");

      // 进一步: 探测 VRM 标准预设里我们没主动查的, 以及完整的自定义表情
      const VRM_EXTRA_PRESETS = ["neutral", "lookUp", "lookDown", "lookLeft", "lookRight"];
      const extraPresets = VRM_EXTRA_PRESETS.filter((n) => expressionExists(manager, n));
      console.log("[VRM] 其它标准预设:", extraPresets.length ? extraPresets.join(", ") : "(无)");
      // 列出全部 expression (包括自定义) — 不同三-vrm 版本 API 名字不一样, 都试一下
      try {
        const all = [];
        const map = manager._expressionMap || manager.expressionMap || null;
        if (map) {
          for (const k of Object.keys(map)) all.push(k);
        }
        if (Array.isArray(manager.expressions)) {
          for (const ex of manager.expressions) {
            const n = ex.expressionName || ex.name || ex.preset;
            if (n && !all.includes(n)) all.push(n);
          }
        }
        console.log("[VRM] 全部 expression (含自定义):", all.length ? all : "(无法枚举)");
      } catch (err) {
        console.warn("[VRM] 无法枚举 expression:", err);
      }

      if (vis.length < 5) {
        console.warn("[VRM] 当前模型缺少完整 a/i/u/e/o 口型, lipsync 会受限");
      }
      resetExpressions();
      applyEmotion("happy", "welcome", { idle: true });   // 加载完默认: 低强度微笑
      applyBasePose();
      listAllBones();
      // 创建 VRM 口型驱动器 (绑定到当前 vrm 实例)
      lipsyncDriver = new VrmLipSyncDriver(vrm, {
        attackTau: 0.040,
        releaseTau: 0.085,
        maxOpen: 1.0,
        minConfidence: 0.30,
        fallbackVowel: "aa",
      });
      setStatus("待机");
    }

    async function speak(text, emotion = "", gesture = "") {
      if (!currentVrm) throw new Error("3D 模型还没加载完成");
      stopCurrentAudio();
      interactionState = "speaking";
      setStatus("合成语音");
      lastSpeechText = text;
      const resolvedEmotion = emotion || detectEmotion(text, "happy");
      applyEmotion(resolvedEmotion, gesture || detectGestureFromText(text, resolvedEmotion));
      const response = await fetch("/api/tts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });
      if (!response.ok) throw new Error("语音合成失败");

      // 后端返回 {audio: base64, audio_mime, pinyin: [...], text}
      const payload = await response.json();
      serverPinyinTrack = Array.isArray(payload.pinyin) ? payload.pinyin : null;
      // base64 → Blob URL
      const binStr = atob(payload.audio || "");
      const bytes = new Uint8Array(binStr.length);
      for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
      const blob = new Blob([bytes], { type: payload.audio_mime || "audio/mpeg" });
      currentAudioUrl = URL.createObjectURL(blob);
      // 现在拿到精确拼音再算口型时间轴
      mouthTimeline = buildMouthTimeline(text, Math.max(1200, Array.from(text).length * 145));
      const audio = new Audio(currentAudioUrl);
      currentAudio = audio;
      audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === "suspended") await audioContext.resume();

      // ── 创建/复用 LipSyncAnalyzer, 并把 <audio> 元素 tap 进来 ──
      if (!lipsyncAnalyzer) {
        lipsyncAnalyzer = new LipSyncAnalyzer(audioContext, {
          fftSize: 1024,
          smoothing: 0.5,
          silenceFloor: 0.012,
          minConfidence: 0.35,
        });
      } else {
        lipsyncAnalyzer.reset();
      }
      lipsyncAnalyzer.connectMediaElement(audio);
      // 旧版 analyser/audioSource 仍保留只是兼容 — 不再使用
      analyser = lipsyncAnalyzer.getAnalyserNode();
      audioSource = null;

      audio.addEventListener("ended", () => {
        stopCurrentAudio();
        interactionState = "idle";
        // 说完话回到低强度的微笑 (即便文本本身偏 sad/relaxed, 待机统一带浅笑)
        applyEmotion("happy", "idle", { idle: true });
        setStatus("待机");
      }, { once: true });
      audio.addEventListener("error", () => {
        stopCurrentAudio();
        interactionState = "idle";
        applyEmotion("happy", "idle", { idle: true });
        setStatus("待机");
      }, { once: true });
      audio.addEventListener("loadedmetadata", () => {
        if (Number.isFinite(audio.duration) && audio.duration > 0) {
          mouthTimeline = buildMouthTimeline(lastSpeechText, audio.duration * 1000);
        }
      }, { once: true });

      setStatus("说话中");
      interactionState = "speaking";
      speechStartedAt = performance.now();
      mouthTimelineIndex = 0;
      await audio.play();
    }

    function extractReply(payload) {
      if (payload && payload.code === 200 && payload.data && payload.data.reply) {
        if (payload.data.session_id) {
          sessionId = payload.data.session_id;
          localStorage.setItem("digitalHuman3dSessionId", sessionId);
        }
        return payload.data.reply;
      }
      if (payload && payload.reply) return payload.reply;
      throw new Error((payload && (payload.msg || payload.detail)) || "对话接口返回异常");
    }

    function extractDigitalHumanState(payload, reply) {
      const data = payload?.data || payload || {};
      const emotion = typeof data.emotion === "string" && data.emotion ? data.emotion : detectEmotion(reply, "happy");
      const gesture = typeof data.gesture === "string" && data.gesture ? data.gesture : detectGestureFromText(reply, emotion);
      return { emotion, gesture };
    }

    function buildSpeechText(text) {
      if (!text) return "";
      return text
        // emoji / pictographs
        .replace(/[\u{1F300}-\u{1FAFF}]/gu, "")
        // dingbats / misc symbols
        .replace(/[\u2600-\u27BF]/g, "")
        // variation selectors / zero-width joiners
        .replace(/[\uFE0E\uFE0F\u200D]/g, "")
        // 常见装饰符号
        .replace(/[★☆◆◇■□▲△▼▽○●◎♢♧☘☀☁☂☃☄☎☏]/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function buildLocalReply(question, error) {
      if (/你好|您好|介绍|你是谁/.test(question)) {
        return {
          emotion: "happy",
          gesture: "welcome",
          reply: "你好，我是灵小游，灵山景区的智能数字人导游。我可以为你讲解景点、推荐路线，也可以回答门票、演出、交通和服务设施问题。"
        };
      }
      if (/路线|推荐|游玩|游览|规划/.test(question)) {
        return {
          emotion: "relaxed",
          gesture: "point",
          reply: "如果你第一次来，我推荐先看九龙灌浴，再到灵山大佛，随后游览梵宫和五印坛城。这样能兼顾代表景观、文化讲解和路线效率。"
        };
      }
      return {
        emotion: "relaxed",
        gesture: "explain",
        reply: "我先按景区导览场景给你建议：如果时间充足，可以按核心景点、文化建筑、休息服务点的顺序游览；如果你告诉我兴趣偏好，比如历史文化、自然风光或亲子游，我可以继续给你定制路线。"
      };
    }

    function getNavigationContext() {
      let location = null;
      let target = null;
      try {
        const raw = localStorage.getItem(NAV_LOCATION_KEY);
        location = raw ? JSON.parse(raw) : null;
      } catch (_) {
        location = null;
      }
      try {
        const rawTarget = localStorage.getItem(NAV_TARGET_KEY);
        target = rawTarget ? JSON.parse(rawTarget) : null;
      } catch (_) {
        target = null;
      }
      const activeRouteId = localStorage.getItem(NAV_ROUTE_KEY) || "";
      return { location, activeRouteId, target };
    }

    function getRouteAction(payload) {
      const data = payload && (payload.data || payload);
      return data && data.route_action ? data.route_action : null;
    }

    function openMapNavigation(action) {
      if (!action || action.type !== "open_map_navigation" || !action.target_spot_id) return;
      localStorage.removeItem(NAV_ROUTE_KEY);
      localStorage.setItem(NAV_TARGET_KEY, JSON.stringify({
        id: action.target_spot_id,
        name: action.target_spot_name || "",
      }));
      const params = new URLSearchParams({
        target_spot_id: String(action.target_spot_id),
      });
      if (action.target_spot_name) params.set("target_name", action.target_spot_name);
      window.location.href = `/digital-human-3d/map?${params.toString()}`;
    }

    async function sendQuestion(question) {
      const text = question.trim();
      if (!text || busy) return;
      addBubble("user", text);
      input.value = "";
      setBusy(true);
      setStatus("思考中");
      setThinkingPose(true);
      try {
        const chatBody = { question: text };
        const navContext = getNavigationContext();
        if (sessionId) chatBody.session_id = sessionId;
        if (navContext.location) chatBody.location = navContext.location;
        const isExplicitNavQuery = /怎么走|往哪走|带我去|去.*怎么走|导航|从这到|到.*怎么走|去.*路线|我要去|我想去/.test(text);
        if (navContext.activeRouteId && !isExplicitNavQuery) chatBody.active_route_id = navContext.activeRouteId;
        if (navContext.target?.name && !isExplicitNavQuery && !/灵山大佛|梵宫|九龙灌浴|五印坛城|祥符禅寺|景点/.test(text)) {
          chatBody.question = `${text}（当前导航目的地：${navContext.target.name}）`;
        }
        const response = await fetch("/api/digital-human/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(chatBody)
        });
        const payload = await response.json();
        const reply = extractReply(payload);
        addBubble("assistant", reply);
        const { emotion, gesture } = extractDigitalHumanState(payload, reply);
        const speechText = buildSpeechText(reply);
        const routeAction = getRouteAction(payload);
        interactionState = "idle";
        applyEmotion(emotion, gesture);
        await speak(speechText || reply, emotion, gesture);
        if (routeAction) {
          openMapNavigation(routeAction);
          return;
        }
      } catch (error) {
        const fallback = buildLocalReply(text, error);
        addBubble("assistant", fallback.reply);
        const speechText = buildSpeechText(fallback.reply);
        interactionState = "idle";
        applyEmotion(fallback.emotion, fallback.gesture || "explain");
        await speak(speechText || fallback.reply, fallback.emotion, fallback.gesture);
      } finally {
        setBusy(false);
        setThinkingPose(false);
        recordBtn.disabled = false;
      }
    }

    composer.addEventListener("submit", (event) => {
      event.preventDefault();
      sendQuestion(input.value);
    });

    recordBtn.addEventListener("click", async () => {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.addEventListener("dataavailable", (event) => {
          if (event.data.size > 0) chunks.push(event.data);
        });
        mediaRecorder.addEventListener("stop", async () => {
          recordBtn.classList.remove("recording");
          recordBtn.textContent = "录音";
          stream.getTracks().forEach((track) => track.stop());
          setStatus("识别中");
          try {
            const blob = new Blob(chunks, { type: mediaRecorder.mimeType || "audio/webm" });
            const form = new FormData();
            form.append("file", blob, "voice.webm");
            const response = await fetch("/api/asr/transcribe?language=zh", {
              method: "POST",
              body: form
            });
            const payload = await response.json();
            const recognized = payload && payload.data && payload.data.text;
            if (!recognized) throw new Error((payload && payload.msg) || "语音识别失败");
            input.value = recognized;
            sendQuestion(recognized);
          } catch (error) {
            addBubble("assistant", error.message || "语音识别失败。");
            applyEmotion("sad", "soft");   // 真出错才显示难过
            setStatus("待机");
          }
        });
        mediaRecorder.start();
        recordBtn.classList.add("recording");
        recordBtn.textContent = "停止";
        setStatus("聆听中");
      } catch (error) {
        addBubble("assistant", "浏览器没有拿到麦克风权限。");
        applyEmotion("sad", "soft");
        setStatus("待机");
      }
    });

    function animate() {
      const delta = clock.getDelta();
      const now = clock.elapsedTime;
      resize();
      controls.update();
      updateBlink(now);

      let speaking = false;
      if (lipsyncAnalyzer && currentAudio && !currentAudio.paused && !currentAudio.ended) {
        speaking = true;
        // 1) 频谱共振峰分析 → 元音权重
        const viseme = lipsyncAnalyzer.analyze();
        // 2) 文本先验 (已有的 mouthTimeline) 作为偏置, 给频谱兜底
        const elapsed = currentAudio.currentTime * 1000 || (performance.now() - speechStartedAt);
        const textPrior = getTimelineViseme(elapsed);
        if (lipsyncDriver) {
          lipsyncDriver.setBias(textPrior);
          lipsyncDriver.apply(viseme, delta);
        }
        // 给身体动作模块用的"嘴张开度"信号 (沿用旧变量)
        mouthValue = mouthValue * 0.7 + Math.max(...BASE_MOUTH_NAMES.map((name) => viseme[name] || 0)) * 0.3;
      } else if (lipsyncDriver) {
        // 静音时让驱动器自然衰减回 0
        lipsyncDriver.apply({ aa: 0, ee: 0, ih: 0, oh: 0, ou: 0, energy: 0, confidence: 0 }, delta);
        mouthValue *= 0.85;
      }
      updateBodyMotion(now, delta, speaking);
      updateExpressionTargets(delta);

      if (currentVrm) {
        currentVrm.update(delta);
      }
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resize);
    addBubble("assistant", "你好，我是灵小游。");
    loadVrm().catch((error) => {
      console.error(error);
      setStatus("模型加载失败");
      addBubble("assistant", "3D 模型加载失败，请确认 VRM 文件可访问。");
    });
    animate();

    // ── 姿势调节器 ──
    let poseEditMode = false;
    const poseDefaults = {
      lx: -0.50, ly: 0.18, lz: -1.14, llz: 0.32,
      rx: -0.17, ry: -0.05, rz: 1.08, rlz: -0.27,
    };

    document.getElementById("poseToggle").addEventListener("click", () => {
      const body = document.getElementById("poseBody");
      poseEditMode = !poseEditMode;
      body.style.display = poseEditMode ? "block" : "none";
      if (!poseEditMode) {
        // 退出编辑模式，恢复动画
        resetExpressions();
        applyBasePose();
      }
    });

    const poseIds = ["lx","ly","lz","llz","rx","ry","rz","rlz","fingerCurl"];
    for (const id of poseIds) {
      const slider = document.getElementById(id);
      const span = document.getElementById(id + "V");
      slider.addEventListener("input", () => {
        span.textContent = parseFloat(slider.value).toFixed(2);
        if (poseEditMode) applyPoseEdit();
      });
    }
    document.getElementById("fingerAxis").addEventListener("change", () => {
      if (poseEditMode) applyPoseEdit();
    });

    function applyPoseEdit() {
      if (!currentVrm) return;
      const v = (id) => parseFloat(document.getElementById(id).value);
      setBoneRotation("leftUpperArm", v("lx"), v("ly"), v("lz"));
      setBoneRotation("rightUpperArm", v("rx"), v("ry"), v("rz"));
      setBoneRotation("leftLowerArm", 0.0, 0.08, v("llz"));
      setBoneRotation("rightLowerArm", 0.0, -0.08, v("rlz"));
      setBoneRotation("chest", 0.0, 0, 0);
      setBoneRotation("spine", 0.0, 0, 0);
      const fc = parseFloat(document.getElementById("fingerCurl").value);
      const fa = document.getElementById("fingerAxis").value;
      curlFingers("left", fc, fa);
      curlFingers("right", fc, fa);
    }

    document.getElementById("poseReset")

    document.getElementById("posePrint").addEventListener("click", () => {
      const v = (id) => parseFloat(document.getElementById(id).value).toFixed(2);
      const out = {
        leftUpperArm:  { x: v("lx"), y: v("ly"), z: v("lz") },
        rightUpperArm: { x: v("rx"), y: v("ry"), z: v("rz") },
        leftLowerArm:  { z: v("llz") },
        rightLowerArm: { z: v("rlz") },
      };
      const json = JSON.stringify(out, null, 2);
      console.log("=== 当前姿势数值 ===\n" + json);
      // 同时弹窗显示
      const pre = document.createElement("pre");
      pre.textContent = json;
      pre.style.cssText = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#111;color:#6f6;padding:20px 24px;border-radius:10px;z-index:999;font-size:13px;white-space:pre;max-width:90vw;";
      document.body.appendChild(pre);
      pre.addEventListener("click", () => pre.remove());
      setTimeout(() => pre.remove(), 8000);
    });

    document.getElementById("poseReset").addEventListener("click", () => {
      for (const [id, val] of Object.entries(poseDefaults)) {
        document.getElementById(id).value = val;
        document.getElementById(id + "V").textContent = val.toFixed(2);
      }
      document.getElementById("fingerCurl").value = 0.77;
      document.getElementById("fingerCurlV").textContent = "0.77";
      document.getElementById("fingerAxis").value = "z";
      if (poseEditMode) applyPoseEdit();
    });

    // 覆盖动画循环中的 updateBodyMotion — 编辑模式下跳过
    const _origUpdateBodyMotion = updateBodyMotion;
    updateBodyMotion = function(now, delta, speaking) {
      if (poseEditMode) {
        // 编辑模式下只做呼吸和眨眼，不碰骨骼
        updateExpressionTargets(delta);
        return;
      }
      return _origUpdateBodyMotion(now, delta, speaking);
    };

    // ── 口型测试面板 ──
    let mouthFreezeMode = false;          // 冻结模式: 直接写入 expressionManager 不被动画/lipsync 覆盖
    const MOUTH_TEST_HOLD_MS = 700;       // 一字按钮按下后保持的时长
    const mouthSliders = MOUTH_NAMES.map((n) => ({
      name: n,
      slider: document.getElementById("m_" + n),
      span: document.getElementById("m_" + n + "V"),
    })).filter((row) => row.slider && row.span);

    function applyMouthTest(viseme) {
      // 直接绕过 lipsyncDriver / updateExpressionTargets 写表情管理器
      if (!currentVrm?.expressionManager) return;
      for (const n of MOUTH_NAMES) {
        const v = clamp(viseme[n] || 0);
        currentVrm.expressionManager.setValue(n, v);
        const row = mouthSliders.find((m) => m.name === n);
        if (row) {
          row.slider.value = v.toFixed(2);
          row.span.textContent = v.toFixed(2);
        }
      }
    }

    function setMouthFreeze(on) {
      mouthFreezeMode = on;
      const btn = document.getElementById("mouthMode");
      btn.classList.toggle("mouth-mode-on", on);
      btn.textContent = on ? "🔓 解冻" : "🔒 冻结";
      if (on) {
        // 冻结时让 lipsync 闭嘴, 避免环境噪声/上一段音频残留干扰
        if (lipsyncDriver) lipsyncDriver.silence(true);
      }
    }

    // 在动画循环末尾追加: 冻结模式下用滑块值压住表情, 不让任何模块覆盖
    const _animateOriginal = animate;
    function patchAnimateForMouthTest() {
      // animate 已通过 requestAnimationFrame 自循环, 我们 hook 一个旁路:
      // 改造为每帧最后强制写一次, 用 wrapper 不可能, 直接劫持 lipsyncDriver.apply
      const origApply = lipsyncDriver?.apply?.bind(lipsyncDriver);
      if (origApply) {
        lipsyncDriver.apply = function(viseme, dt) {
          if (mouthFreezeMode) {
            // 把滑块当前值直接写入, 屏蔽 lipsync
            const v = {};
            for (const m of mouthSliders) v[m.name] = parseFloat(m.slider.value);
            applyMouthTest(v);
            return;
          }
          return origApply(viseme, dt);
        };
      }
    }
    // 等 lipsyncDriver 被创建 (loadVrm 完成) 之后再 patch
    const driverWaitTimer = setInterval(() => {
      if (lipsyncDriver) {
        patchAnimateForMouthTest();
        clearInterval(driverWaitTimer);
      }
    }, 100);

    document.getElementById("mouthToggle").addEventListener("click", () => {
      const body = document.getElementById("mouthBody");
      body.style.display = body.style.display === "block" ? "none" : "block";
    });

    // 滑块: 实时写入 (无论冻结与否, 但不冻结时下一帧就被覆盖, 所以仅冻结模式有效)
    for (const m of mouthSliders) {
      m.slider.addEventListener("input", () => {
        m.span.textContent = parseFloat(m.slider.value).toFixed(2);
        if (mouthFreezeMode && currentVrm?.expressionManager) {
          currentVrm.expressionManager.setValue(m.name, parseFloat(m.slider.value));
        }
      });
    }

    // 字按钮: 用拼音规则算 viseme, 强制冻结模式下保持
    document.getElementById("charGrid").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-py]");
      if (!btn) return;
      const py = btn.dataset.py;
      const cue = pinyinToViseme(py);
      console.log(`[口型测试] ${btn.textContent.replace(/[a-z→A-Z]+/g,"").trim()} (${py}) →`,
                  Object.fromEntries(MOUTH_NAMES.map((n) => [n, +(cue[n]||0).toFixed(2)])));
      if (!mouthFreezeMode) setMouthFreeze(true);
      applyMouthTest(cue);
      // 不自动归零, 保留观察; 用户按"归零"手动清
    });

    document.getElementById("mouthMode").addEventListener("click", () => {
      setMouthFreeze(!mouthFreezeMode);
    });

    document.getElementById("mouthClear").addEventListener("click", () => {
      applyMouthTest(emptyViseme());
      setMouthFreeze(false);
    });
  </script>
</body>
</html>
