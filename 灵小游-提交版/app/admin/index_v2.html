<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>灵山导览管理后台</title>
<style>
:root{font-family:"Microsoft YaHei",Arial,sans-serif;color:#eaf4ef;background:#101715;--panel:#18221f;--line:#30413b;--muted:#9bb0a8;--accent:#68c8a9;--danger:#e27e91;--warn:#e2c57e;--info:#7ec8e2}*{box-sizing:border-box}body{margin:0;background:#101715}
button,input,textarea,select{font:inherit}button{border:1px solid var(--line);background:#22312c;color:var(--accent);padding:9px 13px;border-radius:7px;cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#102019;border-color:var(--accent);font-weight:700}button.danger{color:#ff9caf}button.ghost{background:transparent;border-color:transparent;color:var(--muted)}button.ghost:hover{color:var(--accent)}
.shell{max-width:1440px;margin:auto;padding:28px}
.header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:22px}
.eyebrow{color:var(--accent);font-size:13px}.header h1{margin:6px 0;font-size:30px}.header p,.hint{color:var(--muted);margin:0;line-height:1.6}
.auth{display:flex;gap:8px;align-items:center;min-width:min(520px,100%)}.auth input{flex:1}
.input,textarea,select{width:100%;border:1px solid var(--line);background:#111b18;color:#eaf4ef;border-radius:7px;padding:10px}
textarea{min-height:120px;resize:vertical}.auth input{height:38px}
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{border:0;border-radius:7px 7px 0 0;background:transparent;color:var(--muted);padding:10px 18px;font-size:15px}
.tab.active{background:#22312c;color:var(--accent)}
.view{display:none}.view.active{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
.panel h2{margin:0 0 4px;font-size:19px}.panel>.hint{margin-bottom:12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
.toolbar .input{max-width:280px}
.status{padding:10px 12px;border:1px solid var(--line);border-radius:7px;color:var(--muted);margin:12px 0;font-size:13px}
.status.ok{color:var(--accent)}.status.error{color:#ff9caf}
.status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:var(--muted)}.status.ok .dot{background:var(--accent)}.status.error .dot{background:var(--danger)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.5px}td{font-size:14px}
tr.row-doc{cursor:pointer;transition:background .15s}tr.row-doc:hover{background:#1e2a26}tr.row-doc.selected{background:#1a3028;outline:1px solid var(--accent);outline-offset:-1px}
tr.row-doc.selected td{color:var(--accent)}
.edit-row{background:#111b18}.edit-row td{padding:16px 20px}
.doc-name{font-weight:600}.doc-name small{font-weight:400;color:var(--muted);font-size:12px;display:block;margin-top:2px;word-break:break-all}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;border:1px solid var(--line)}
.tag.ok{color:var(--accent);border-color:#2d5c44}.tag.warn{color:var(--warn);border-color:#5c4f2d}.tag.err{color:var(--danger);border-color:#5c2d36}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}
.field label{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.human-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.human-card{border:2px solid var(--line);border-radius:10px;padding:16px;background:#141e1b;cursor:pointer;transition:all .15s;position:relative}
.human-card:hover{border-color:#3d5a4a}.human-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px #68c8a944}
.human-card.active{border-color:var(--accent)}.human-card .badge{position:absolute;top:12px;right:12px;background:var(--accent);color:#102019;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700}
.human-card h3{margin:0 0 6px;font-size:17px}.human-card .meta{font-size:12px;color:var(--muted);margin-bottom:8px}.human-card p{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.empty{padding:36px;text-align:center;color:var(--muted)}
.toast{position:fixed;top:24px;right:24px;z-index:9999;padding:12px 20px;border-radius:8px;font-size:14px;max-width:420px;animation:toastIn .3s ease;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.toast.ok{background:#1a3a2a;border:1px solid var(--accent);color:var(--accent)}.toast.err{background:#3a1a22;border:1px solid var(--danger);color:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
.doc-editor{padding:0}.split{display:flex;gap:18px}.split>.panel{flex:1;margin-bottom:0}
@media(max-width:900px){.header,.auth{flex-direction:column;align-items:stretch}.split{flex-direction:column}.human-grid{grid-template-columns:1fr 1fr}}
@media(max-width:580px){.shell{padding:16px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.human-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="shell">
<header class="header">
  <div>
    <div class="eyebrow">LINGSHAN GUIDE / ADMIN</div>
    <h1>灵山导览管理后台</h1>
    <p>维护景区知识库 · 配置数字人形象与声音</p>
  </div>
  <div class="auth">
    <input id="token" placeholder="粘贴管理员 JWT">
    <button id="saveToken" class="primary">连接后台</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-view="knowledge">知识库管理</button>
  <button class="tab" data-view="human">数字人配置</button>
</nav>

<!-- ==================== 知识库管理 ==================== -->
<section id="knowledge" class="view active">

  <div class="split">
    <!-- 左侧：文档列表 -->
    <div class="panel" style="flex:1.2">
      <h2>📚 Dify 知识库文档</h2>
      <div id="difyStatus" class="status"><span class="dot"></span> 尚未连接</div>
      <div class="toolbar">
        <input class="input" id="docSearch" placeholder="🔍 搜索文档名...">
        <button id="refreshDocs">刷新</button>
      </div>
      <table>
        <thead><tr><th style="width:45%">文档名称</th><th>状态</th><th style="width:18%">更新时间</th><th style="width:15%">操作</th></tr></thead>
        <tbody id="docRows"><tr><td colspan="4" class="empty">请先连接管理员账号</td></tr></tbody>
      </table>
    </div>

    <!-- 右侧：新增 & 检索 -->
    <div class="panel" style="flex:.8">
      <h2>➕ 新建文档</h2>
      <div class="field" style="margin-bottom:10px"><label>文档名称</label><input class="input" id="docName" placeholder="例如：灵山大佛讲解词"></div>
      <div class="field" style="margin-bottom:10px"><label>文本内容</label><textarea id="docText" placeholder="粘贴讲解词、文史资料..." style="min-height:140px"></textarea></div>
      <div class="toolbar">
        <button id="createText" class="primary">📝 提交文本</button>
        <input class="input" id="docFile" type="file" style="max-width:180px">
        <button id="uploadFile">📎 上传文件</button>
      </div>
      <hr style="border-color:var(--line);margin:16px 0">
      <h2>🔍 检索测试</h2>
      <div class="toolbar">
        <input class="input" id="retrieveQuery" placeholder="输入问题测试知识库..." style="max-width:100%">
        <button id="retrieve" class="primary">搜索</button>
      </div>
      <pre id="retrieveResult" class="hint" style="white-space:pre-wrap;max-height:200px;overflow:auto;font-size:12px"></pre>
    </div>
  </div>
</section>

<!-- ==================== 数字人配置 ==================== -->
<section id="human" class="view">
  <div class="panel">
    <h2>🎭 数字人形象</h2>
    <p class="hint">点击形象卡片编辑配置。激活后游客端刷新即切换外观，声音同步用于 TTS。</p>
    <div id="humanRows" class="human-grid"><div class="empty">请先连接管理员账号</div></div>
  </div>

  <div id="humanEditor" class="panel" style="display:none">
    <h2 id="humanEditorTitle">✏️ 编辑形象</h2>
    <div class="form-grid">
      <div class="field">
        <label>模型</label>
        <select class="input" id="humanModel"></select>
      </div>
      <div class="field">
        <label>显示名称</label>
        <input class="input" id="humanName">
      </div>
      <div class="field">
        <label>TTS 声音</label>
        <input class="input" id="humanVoice" placeholder="zh-CN-XiaoyiNeural">
      </div>
      <div class="field">
        <label>声音风格</label>
        <input class="input" id="humanVoiceStyle" placeholder="少女/清亮">
      </div>
      <div class="field full">
        <label>关键词（逗号分隔）</label>
        <input class="input" id="humanKeywords" placeholder="少女,亲和,轻快,互动">
      </div>
      <div class="field full">
        <label>外观描述</label>
        <textarea id="humanAppearance" style="min-height:60px"></textarea>
      </div>
      <div class="field">
        <label>服装描述</label>
        <textarea id="humanClothing" style="min-height:60px"></textarea>
      </div>
      <div class="field">
        <label>文化风格</label>
        <textarea id="humanCulture" style="min-height:60px"></textarea>
      </div>
    </div>
    <div class="toolbar" style="margin-top:14px">
      <button id="saveHuman" class="primary">💾 保存配置</button>
      <button id="activateHuman">⚡ 保存并激活</button>
      <button id="cancelHuman" class="ghost">取消</button>
    </div>
  </div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
let docs=[],humans=[],catalog=[];
let editingDoc=null, editingHumanId=null;
const tokenKey='lingshanAdminToken';
$('token').value=localStorage.getItem(tokenKey)||'';

function auth(){let t=$('token').value.trim();return t&&!t.startsWith('Bearer ')?'Bearer '+t:t}
function msg(text,type){const el=$('difyStatus');el.innerHTML=`<span class="dot"></span> ${text}`;el.className='status '+(type||'')}
function toast(text,type){const t=document.createElement('div');t.className='toast '+(type||'ok');t.textContent=text;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function api(path,options={}){
  const headers=new Headers(options.headers||{});
  const t=auth();if(t)headers.set('Authorization',t);
  const r=await fetch(path,{...options,headers});let p={};
  try{p=await r.json()}catch{}
  if(!r.ok||(p.code&&p.code!==200))throw new Error(p.detail||p.msg||`HTTP ${r.status}`);
  return p.data??p
}

// ==================== 文档 ====================
async function loadDocs(){
  try{
    const c=await api('/api/admin/knowledge/config');
    msg(`数据集 ${c.dataset_id_masked||'未配置'} · API Key ${c.api_key_configured?'已配置 ✅':'未配置 ❌'}`,c.api_key_configured?'ok':'');
    docs=((await api('/api/admin/knowledge/documents?limit=100')).data||(await api('/api/admin/knowledge/documents?limit=100')).documents||(await api('/api/admin/knowledge/documents?limit=100')).items||[]);
    renderDocs()
  }catch(e){msg(e.message,'error');$('docRows').innerHTML=`<tr><td colspan="4" class="empty">${esc(e.message)}</td></tr>`}
}

function statusTag(s){
  s=(s||'').toLowerCase();
  if(s==='completed'||s==='done')return'<span class="tag ok">已就绪</span>';
  if(s==='indexing'||s==='parsing')return'<span class="tag warn">解析中</span>';
  if(s==='error')return'<span class="tag err">异常</span>';
  return`<span class="tag">${esc(s||'已提交')}</span>`
}

function renderDocs(){
  const q=$('docSearch').value.trim().toLowerCase();
  const list=docs.filter(d=>!q||String(d.name||d.document_name||'').toLowerCase().includes(q));
  if(!list.length){$('docRows').innerHTML='<tr><td colspan="4" class="empty">暂无文档</td></tr>';return}
  $('docRows').innerHTML=list.map(d=>{
    const id=d.id||d.document_id, name=d.name||d.document_name||id;
    const isSel=editingDoc===id;
    let rows=`<tr class="row-doc${isSel?' selected':''}" onclick="toggleEditDoc('${esc(id)}')">
      <td><span class="doc-name">${esc(name)}<small>${esc(id)}</small></span></td>
      <td>${statusTag(d.indexing_status||d.status)}</td>
      <td>${esc((d.updated_at||d.created_at||'').split('T')[0])}</td>
      <td class="actions">
        <button onclick="event.stopPropagation();toggleEditDoc('${esc(id)}')">✏️ 编辑</button>
        <button class="danger" onclick="event.stopPropagation();deleteDoc('${esc(id)}','${esc(name)}')">🗑</button>
      </td></tr>`;
    if(isSel) rows+=`<tr class="edit-row"><td colspan="4">
      <div class="form-grid" style="margin:0">
        <div class="field full"><label>文档名称</label><input class="input" id="editName_${esc(id)}" value="${esc(name)}"></div>
        <div class="field full"><label>正文内容</label><textarea id="editText_${esc(id)}" style="min-height:200px">加载中...</textarea></div>
      </div>
      <div class="toolbar" style="margin-top:12px">
        <button class="primary" onclick="saveDoc('${esc(id)}')">💾 保存</button>
        <button onclick="cancelEdit()">关闭</button>
      </div></td></tr>`;
    return rows
  }).join('')
}

window.toggleEditDoc=async function(id){
  if(editingDoc===id){cancelEdit();return}
  editingDoc=id;renderDocs();
  try{
    const d=await api('/api/admin/knowledge/documents/'+encodeURIComponent(id));
    const x=d.data||d;
    const nameEl=$('editName_'+id), textEl=$('editText_'+id);
    if(nameEl)nameEl.value=x.name||x.document_name||'';
    if(textEl)textEl.value=x.text||x.content||''
  }catch(e){toast('加载文档失败: '+e.message,'err')}
}

window.cancelEdit=function(){editingDoc=null;renderDocs()}

window.saveDoc=async function(id){
  const name=$('editName_'+id), text=$('editText_'+id);
  if(!name||!text)return;
  try{
    await api('/api/admin/knowledge/documents/'+encodeURIComponent(id)+'/text',{
      method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:name.value.trim(),text:text.value,process_rule_mode:'automatic'})
    });
    toast('文档已更新 ✅','ok');editingDoc=null;await loadDocs()
  }catch(e){toast('保存失败: '+e.message,'err')}
}

window.deleteDoc=async function(id,name){
  if(!confirm(`确定删除文档「${name}」？\n此操作不可恢复。`))return;
  try{await api('/api/admin/knowledge/documents/'+encodeURIComponent(id),{method:'DELETE'});toast(`已删除「${name}」`,'ok');if(editingDoc===id)editingDoc=null;await loadDocs()}catch(e){toast('删除失败: '+e.message,'err')}
}

$('createText').onclick=async()=>{
  const n=$('docName').value.trim(); if(!n)return toast('请输入文档名称','err');
  try{await api('/api/admin/knowledge/documents/text',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,text:$('docText').value,indexing_technique:'high_quality',process_rule_mode:'automatic'})});toast('「'+n+'」已提交，Dify 正在解析','ok');$('docName').value='';$('docText').value='';await loadDocs()}catch(e){toast(e.message,'err')}
};

$('uploadFile').onclick=async()=>{
  const f=$('docFile').files[0];if(!f)return toast('请选择文件','err');
  const fd=new FormData();fd.append('file',f);
  try{await api('/api/admin/knowledge/documents/file',{method:'POST',body:fd});toast('「'+f.name+'」已提交','ok');$('docFile').value='';await loadDocs()}catch(e){toast(e.message,'err')}
};

$('retrieve').onclick=async()=>{
  try{$('retrieveResult').textContent=JSON.stringify(await api('/api/admin/knowledge/retrieve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:$('retrieveQuery').value,top_k:5})}),null,2)}catch(e){$('retrieveResult').textContent='❌ '+e.message}
};
$('docSearch').oninput=renderDocs;$('refreshDocs').onclick=loadDocs;

// ==================== 数字人 ====================
async function loadHumans(){
  try{
    catalog=(await api('/api/digital-human/catalog')).items||[];
    humans=(await api('/api/admin/digital-humans')).items||[];
    $('humanModel').innerHTML=catalog.map(x=>`<option value="${esc(x.model_key)}">${esc(x.model_label)}</option>`).join('');
    renderHumans()
  }catch(e){$('humanRows').innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}

function renderHumans(){
  if(!humans.length){$('humanRows').innerHTML='<div class="empty">暂无配置</div>';return}
  $('humanRows').innerHTML=humans.map(x=>`
    <article class="human-card${x.is_active?' active':''}${editingHumanId===x.id?' selected':''}" onclick="selectHuman(${x.id})">
      ${x.is_active?'<span class="badge">当前激活</span>':''}
      <h3>${esc(x.name)}</h3>
      <div class="meta">${esc(x.model_label||x.model_key)} · ${esc(x.voice_name)} · ${esc(x.voice_style||'')}</div>
      <p>${esc(x.appearance||'')} · ${esc(x.clothing||'')}</p>
    </article>`).join('')+`
    <article class="human-card" style="border-style:dashed;display:flex;align-items:center;justify-content:center;min-height:120px" onclick="newHuman()">
      <span style="color:var(--muted);font-size:28px">+</span>
    </article>`
}

window.selectHuman=function(id){
  editingHumanId=id;
  const x=humans.find(v=>v.id===id);if(!x)return;
  $('humanEditor').style.display='block';
  $('humanEditorTitle').textContent='✏️ 编辑 — '+x.name;
  $('humanModel').value=x.model_key;$('humanName').value=x.name||'';
  $('humanVoice').value=x.voice_name||'';$('humanVoiceStyle').value=x.voice_style||'';
  $('humanKeywords').value=x.keywords||'';$('humanAppearance').value=x.appearance||'';
  $('humanClothing').value=x.clothing||'';$('humanCulture').value=x.cultural_style||'';
  $('humanEditor').scrollIntoView({behavior:'smooth'});renderHumans()
}

window.newHuman=function(){
  editingHumanId=null;
  $('humanEditor').style.display='block';
  $('humanEditorTitle').textContent='➕ 新建形象配置';
  $('humanModel').value=catalog.length?catalog[0].model_key:'';
  $('humanName').value='';$('humanVoice').value='zh-CN-XiaoyiNeural';
  $('humanVoiceStyle').value='';$('humanKeywords').value='';$('humanAppearance').value='';
  $('humanClothing').value='';$('humanCulture').value='';
  $('humanEditor').scrollIntoView({behavior:'smooth'});renderHumans()
}

$('cancelHuman').onclick=()=>{$('humanEditor').style.display='none';editingHumanId=null;renderHumans()}

function humanBody(active){return{model_key:$('humanModel').value,name:$('humanName').value.trim(),voice_name:$('humanVoice').value.trim(),voice_style:$('humanVoiceStyle').value.trim(),keywords:$('humanKeywords').value.trim(),appearance:$('humanAppearance').value.trim(),clothing:$('humanClothing').value.trim(),cultural_style:$('humanCulture').value.trim(),is_active:active}}

$('saveHuman').onclick=()=>saveHuman(false);
$('activateHuman').onclick=()=>saveHuman(true);

async function saveHuman(active){
  const body=humanBody(active);
  try{
    if(editingHumanId){
      await api('/api/admin/digital-humans/'+editingHumanId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      toast(active?'已保存并激活「'+body.name+'」✅':'「'+body.name+'」已保存','ok')
    }else{
      const x=await api('/api/admin/digital-humans',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,name:body.name||'新形象'})});
      toast('新配置「'+body.name+'」已创建','ok');editingHumanId=x.id
    }
    await loadHumans();
    if(editingHumanId) selectHuman(editingHumanId)
  }catch(e){toast(e.message,'err')}
}

window.activateHuman=async function(id){
  try{await api('/api/admin/digital-humans/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_active:true})});await loadHumans();toast('已切换激活形象','ok')}catch(e){toast(e.message,'err')}
};

// ==================== 连接 ====================
$('saveToken').onclick=async()=>{
  if(!$('token').value.trim())return;
  const btn=$('saveToken');btn.textContent='连接中...';btn.disabled=true;
  localStorage.setItem(tokenKey,$('token').value.trim());
  try{await loadDocs();await loadHumans();
    btn.textContent='✓ 已连接';btn.style.background='#10b563';btn.style.color='#fff';btn.style.borderColor='#10b563';
    setTimeout(()=>{btn.textContent='连接后台';btn.style.background='';btn.style.color='';btn.style.borderColor=''},2500)
  }catch(e){btn.textContent='连接后台';btn.disabled=false}
  btn.disabled=false
};

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');$(b.dataset.view).classList.add('active')
});
</script>
</body>
</html>
